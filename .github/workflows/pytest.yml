name: Python unit tests
# The bin/ script tests in tests/python; nf-test runs no process body, so these are
# the only CI check of the scripts' logic. Same pins as the general container.
on:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: docker/env/general.yml
          create-args: pytest

      - name: Run pytest
        shell: bash -el {0}
        run: python3 -m pytest tests/python -q
